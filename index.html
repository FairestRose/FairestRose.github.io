<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snow White | Links</title>

  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <button id="theme-toggle">☀️</button>

  <div class="container">
    <img src="me.JPG" alt="Profile" class="profile">

    <h1>@FairestRose</h1>
    <p class="bio">Cyber Security • Developer • Ethical Hacking</p>

    <div class="socials">
      <a href="https://instagram.com/yourname" target="_blank">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://github.com/yourusername" target="_blank">
        <i class="fab fa-github"></i>
      </a>
      <a href="https://linkedin.com/in/yourname" target="_blank">
        <i class="fab fa-linkedin"></i>
      </a>
    </div>

    <div class="links">
      <a href="#">Portfolio</a>
      <a href="#">Projects</a>
      <a href="#">Blog</a>
      <a href="mailto:mozardsghost@gmail.com">Contact Me</a>
    </div>

    <iframe style="border-radius:12px"
      src="https://open.spotify.com/embed/track/11dFghVXANMlKmJXsNCbNl"
      width="100%"
      height="80"
      frameBorder="0"
      allowfullscreen=""
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>

    <footer>Built with GitHub Pages</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
